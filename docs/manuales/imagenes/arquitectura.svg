<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>
  <!-- HP -->
  <rect x="30" y="60" width="700" height="600" rx="18" fill="#f7f7f7" stroke="#7f7f7f" stroke-width="2"/>
  <text x="50" y="95" font-size="24" font-weight="bold" fill="#333">HP de Andrés · Windows 11 · VirtualBox 7.2</text>
  <!-- SGSPRI -->
  <rect x="60" y="130" width="300" height="300" rx="14" fill="#fbeff1" stroke="#a6192e" stroke-width="3"/>
  <text x="210" y="168" font-size="26" font-weight="bold" fill="#a6192e" text-anchor="middle">SGSPRI</text>
  <text x="210" y="196" font-size="17" fill="#333" text-anchor="middle">Servidor principal</text>
  <text x="210" y="226" font-size="16" fill="#333" text-anchor="middle">Oracle Linux 8.10</text>
  <text x="210" y="250" font-size="16" fill="#333" text-anchor="middle">Oracle 21c EE · CDB SGS</text>
  <text x="210" y="274" font-size="16" fill="#333" text-anchor="middle">PDB SGSPDB (SGS_ADMIN)</text>
  <text x="210" y="304" font-size="15" fill="#555" text-anchor="middle">192.168.56.101</text>
  <text x="210" y="326" font-size="15" fill="#555" text-anchor="middle">Tailscale 100.76.209.30</text>
  <text x="210" y="360" font-size="15" fill="#333" text-anchor="middle">Jobs, packages, correo,</text>
  <text x="210" y="382" font-size="15" fill="#333" text-anchor="middle">RMAN, padrón, wallet</text>
  <text x="210" y="410" font-size="14" fill="#a6192e" text-anchor="middle">PRIMARY · READ WRITE</text>
  <!-- SGSSTB -->
  <rect x="400" y="130" width="300" height="300" rx="14" fill="#eef3fb" stroke="#2f5597" stroke-width="3"/>
  <text x="550" y="168" font-size="26" font-weight="bold" fill="#2f5597" text-anchor="middle">SGSSTB</text>
  <text x="550" y="196" font-size="17" fill="#333" text-anchor="middle">Servidor standby</text>
  <text x="550" y="226" font-size="16" fill="#333" text-anchor="middle">Oracle Linux 8.10</text>
  <text x="550" y="250" font-size="16" fill="#333" text-anchor="middle">Oracle 21c EE · CDB SGS</text>
  <text x="550" y="274" font-size="16" fill="#333" text-anchor="middle">Standby física (copia)</text>
  <text x="550" y="304" font-size="15" fill="#555" text-anchor="middle">192.168.56.102</text>
  <text x="550" y="326" font-size="15" fill="#555" text-anchor="middle">Tailscale 100.69.133.78</text>
  <text x="550" y="360" font-size="15" fill="#333" text-anchor="middle">Aplica el redo en tiempo real;</text>
  <text x="550" y="382" font-size="15" fill="#333" text-anchor="middle">copia de los respaldos</text>
  <text x="550" y="410" font-size="14" fill="#2f5597" text-anchor="middle">PHYSICAL STANDBY · READ ONLY</text>
  <!-- Data Guard -->
  <line x1="362" y1="250" x2="386" y2="250" stroke="#333" stroke-width="4"/>
  <polygon points="386,240 399,250 386,260" fill="#333"/>
  <text x="380" y="232" font-size="13" fill="#333" text-anchor="middle">redo</text>
  <rect x="120" y="470" width="520" height="150" rx="12" fill="#ffffff" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="380" y="505" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Red interna solo-anfitrión 192.168.56.0/24</text>
  <text x="380" y="535" font-size="16" fill="#333" text-anchor="middle">Data Guard (redo ASYNC) y broker sgs_dg</text>
  <text x="380" y="561" font-size="16" fill="#333" text-anchor="middle">rsync de los respaldos y SSH entre los servidores</text>
  <text x="380" y="595" font-size="15" fill="#555" text-anchor="middle">Cada VM sale a internet por su propia tarjeta NAT</text>
  <!-- Mac -->
  <rect x="860" y="130" width="300" height="200" rx="14" fill="#f2f2f2" stroke="#7f7f7f" stroke-width="2"/>
  <text x="1010" y="170" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">Mac de Isaac</text>
  <text x="1010" y="204" font-size="16" fill="#333" text-anchor="middle">DBeaver y SQL*Plus</text>
  <text x="1010" y="228" font-size="16" fill="#333" text-anchor="middle">(cliente de la base)</text>
  <text x="1010" y="262" font-size="15" fill="#555" text-anchor="middle">Docker Oracle Free</text>
  <text x="1010" y="284" font-size="15" fill="#555" text-anchor="middle">(ambiente de desarrollo)</text>
  <line x1="745" y1="230" x2="846" y2="230" stroke="#2f5597" stroke-width="3" stroke-dasharray="10 6"/>
  <polygon points="745,220 732,230 745,240" fill="#2f5597"/>
  <polygon points="846,220 859,230 846,240" fill="#2f5597"/>
  <text x="797" y="216" font-size="15" fill="#2f5597" text-anchor="middle">Tailscale</text>
  <text x="797" y="252" font-size="13" fill="#2f5597" text-anchor="middle">(sin exit node)</text>
  <!-- Gmail -->
  <rect x="860" y="430" width="300" height="140" rx="14" fill="#fff8e5" stroke="#bf8f00" stroke-width="2"/>
  <text x="1010" y="470" font-size="22" font-weight="bold" fill="#7f6000" text-anchor="middle">Gmail (SMTP)</text>
  <text x="1010" y="502" font-size="16" fill="#333" text-anchor="middle">smtp.gmail.com:465 (TLS)</text>
  <text x="1010" y="528" font-size="15" fill="#555" text-anchor="middle">Notificaciones del sistema</text>
  <line x1="732" y1="500" x2="846" y2="500" stroke="#bf8f00" stroke-width="3"/>
  <polygon points="846,490 859,500 846,510" fill="#bf8f00"/>
  <text x="795" y="472" font-size="14" fill="#7f6000" text-anchor="middle">Correo directo</text>
  <text x="795" y="489" font-size="14" fill="#7f6000" text-anchor="middle">desde Oracle</text>
  <text x="795" y="530" font-size="12" fill="#7f6000" text-anchor="middle">(sale por NAT)</text>
</svg>
